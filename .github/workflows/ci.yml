name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Testes automáticos (regras de alerta, planilha, "só lê e avisa")
        run: node fluxos/testes/avaliar.test.js

      - name: Sintaxe dos scripts (bash)
        run: bash -n monitor/instalar.sh central/criar-usuario-monitor.sh central/remover-usuario-monitor.sh

      - name: shellcheck (somente erros; informativo, não bloqueia)
        continue-on-error: true
        run:shellcheck -S error monitor/instalar.sh central/criar-usuario-monitor.sh central/remover-usuario-monitor.sh

      - name: Varredura de segredos e dados internos
        run: node tools/varredura.js

      - name: Formato da documentação
        run: node tools/revisar-docs.js
